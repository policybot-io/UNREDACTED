<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary Meta -->
    <title>UNREDACTED — Government Spending & Dark Money Tracker</title>
    <meta name="description" content="Track government contracts, trace dark money, and expose corruption networks. Free open-source intelligence on federal spending, PAC donations, STOCK Act violations, and influence networks." />
    <meta name="theme-color" content="#0a0a0a" />
    <link rel="canonical" href="https://unredacted.vercel.app/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://unredacted.vercel.app/" />
    <meta property="og:site_name" content="UNREDACTED" />
    <meta property="og:title" content="UNREDACTED — Government Spending & Dark Money Tracker" />
    <meta property="og:description" content="Track government contracts, trace dark money, and expose corruption networks. Free open-source intelligence on federal spending, PAC donations, and influence networks." />
    <meta property="og:image" content="https://unredacted.vercel.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="UNREDACTED — Government Spending & Dark Money Tracker" />
    <meta name="twitter:description" content="Track government contracts, trace dark money, and expose corruption networks. Free open-source intelligence platform." />
    <meta name="twitter:image" content="https://unredacted.vercel.app/og-image.png" />

    <!-- Security -->
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin" />

    <!-- JSON-LD: WebApplication -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "UNREDACTED",
      "url": "https://unredacted.vercel.app/",
      "description": "Free open-source intelligence platform for tracking government contracts, dark money, PAC donations, STOCK Act violations, and federal spending.",
      "applicationCategory": "GovernmentApplication",
      "operatingSystem": "All",
      "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
      "creator": { "@type": "Organization", "name": "UNREDACTED", "url": "https://unredacted.vercel.app/" }
    }
    </script>

    <!-- Google Fonts: Roboto -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet" />

    <!-- Preconnect to government APIs used at runtime -->
    <link rel="preconnect" href="https://api.open.fec.gov" />
    <link rel="preconnect" href="https://api.usaspending.gov" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
